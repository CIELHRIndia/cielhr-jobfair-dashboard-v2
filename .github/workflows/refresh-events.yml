name: Refresh Job Fair Data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose refresh mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - cleanup-only

  schedule:
    # Run every day at 9:00 AM IST (03:30 UTC)
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Manual full refresh
      - name: Manual full refresh
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/research.py

      # Manual cleanup-only test
      - name: Manual cleanup only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'cleanup-only'
        run: python scripts/research.py --cleanup-only

      # Automatic scheduled run
      - name: Automatic scheduled refresh
        if: github.event_name == 'schedule'
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          DAY_OF_WEEK=$(date -u +%u)

          if [ "$DAY_OF_WEEK" = "1" ]; then
            echo "Monday — running cleanup + Tavily research."
            python scripts/research.py
          else
            echo "Tuesday-Sunday — running cleanup only."
            python scripts/research.py --cleanup-only
          fi

      - name: Commit updated event data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events.json

          if git diff --cached --quiet; then
            echo "No event data changes to commit."
          else
            git commit -m "Automated V2 job fair data refresh"
            git push
          fi
